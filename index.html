<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0a" />
    <script>
      (() => {
        const path = location.pathname.replace(/\/+$/, "");
        if (path !== "/resume") return;

        const saved = localStorage.getItem("portfolio-prototype-color-mode");
        const mode = saved === "light" ? "light" : "dark";
        document.documentElement.dataset.colorMode = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === "dark"
          ? "#0b0b0a"
          : "#f2f2f2";
      })();
    </script>
    <style>
      html, body, #root { background: #0b0b0a; }
      html[data-color-mode="light"],
      html[data-color-mode="light"] body,
      html[data-color-mode="light"] #root { background: #f2f2f2; }
    </style>
    <meta name="description" content="Akshar Patel's personal portfolio." />
    <link rel="icon" href="/src/assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Akshar Patel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
