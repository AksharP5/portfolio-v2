<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <script>
      (() => {
        const saved = localStorage.getItem("portfolio-prototype-color-mode");
        const mode = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.colorMode = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === "dark"
          ? "#0c0c0c"
          : "#f2f2f2";
      })();
    </script>
    <style>
      html, body, #root { background: #0c0c0c; }
      html[data-color-mode="light"],
      html[data-color-mode="light"] body,
      html[data-color-mode="light"] #root { background: #f2f2f2; }
    </style>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/src/assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <title>Contact Akshar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/prototypes/portfolio/main.jsx"></script>
  </body>
</html>
